<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Lists</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        ul#lists {
            list-style-type: none;
            padding: 0;
        }
        ul#lists li {
            padding: 10px;
            margin: 5px 0;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        ul#lists li:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Interactive Lists</h2>
        <ul id="lists">
            <li>Interactive Item 1</li>
            <li>Interactive Item 2</li>
            <li>Interactive Item 3</li>
        </ul>
    </div>
    <script>
        let ul = document.querySelector("#lists");

        ul.addEventListener("click", (e) => {
            if (e.target.tagName === "LI") {
                let backgroundColor = e.target.style.backgroundColor === '' ||
                    e.target.style.backgroundColor === 'gray' ? 'lightgreen' : 'gray';
                console.log(e.target.style.backgroundColor);
                e.target.style.backgroundColor = backgroundColor;
            }
        });
    </script>
</body>
</html>
