<html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Unordered List</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        text-align: center;
    }

    h1 {
        text-align: center;
        color: #333;
    }

    a.styled-link {
        text-decoration: none;
        color: #4CAF50;
        font-size: 20px;
        font-weight: bold;
        padding: 10px 20px;
        border: 2px solid #4CAF50;
        border-radius: 5px;
        transition: all 0.3s ease;
        margin: 5px;
        display: inline-block;
    }

    a.styled-link span {
        display: block;
        padding: 10px;
    }

    a.styled-link:hover {
        background-color: #4CAF50;
        color: white;
    }
</style>

<head>
    <script async>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelector("a").addEventListener("click", (e) => {
                e.preventDefault();
                console.log("Link click prevented");
            });

        });

    </script>
</head>

<body>
    <div class="container">
        <h1>List of a tags</h1>
        <a href="#" class="styled-link">Click Me</a>
        <a href="#" class="styled-link">Link 1</a>
        <a href="#" class="styled-link">Link 2</a>
        <a href="#" class="styled-link">Link 3</a>
        <a href="#" class="styled-link">Link 4</a>
        <a href="#" class="styled-link">Link 5</a>
    </div>

</body>

</html>
