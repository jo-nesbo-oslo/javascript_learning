<!DOCTYPE html>
<html?>

<head>
    <title>DOM and Events</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #73C8A9, #373B44);
            font-family: -apple-system, BlinkMacSystemFont,
                'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 
                'Open Sans', 'Helvetica Neue', sans-serif;
        }

        h3 {
            color: #ffffff;
            background-color: #4B79A1;
            padding: 10px;
            border-radius: 5px;
        }

        .inputArea {
            padding: 10px;
            border: 2px solid #4B79A1;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 1.1em;
        }

        p {
            color: #ffffff;
            background-color: #4B79A1;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 1.1em;
        }
    </style>
</head>

<body>
    <div>
        <h3>
            Message will be displayed when 
            you press an Enter key
        </h3>

        <input type="text" class="inputArea">
        <p></p>
    </div>

    <script>
        let input = document.querySelector(".inputArea");
        let p = document.querySelector("p");
      
        input.addEventListener('keydown', function(e) {
            if (e.keyCode == 13) {
                p.textContent = "You pressed Enter";
            }
        })
    </script>
</body>

</html>
